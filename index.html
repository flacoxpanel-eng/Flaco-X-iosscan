<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLACO X — iOS Forensic Anti-Cheat</title>
    <style>
        :root {
            --bg-black: #000000;
            --card-black: #0a0a0a;
            --input-black: #050505;
            --primary-red: #ff0000;
            --dark-red: #8b0000;
            --border-red: #330000;
            --text-white: #ffffff;
            --text-dim-red: #ff6666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-black);
            border: 2px solid var(--dark-red);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--dark-red);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .brand span {
            color: var(--primary-red);
            text-shadow: 0 0 10px var(--primary-red);
        }

        .status-badge {
            background-color: var(--bg-black);
            color: var(--primary-red);
            border: 1px solid var(--primary-red);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--primary-red);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 14px;
            background-color: var(--input-black);
            border: 1px solid var(--border-red);
            border-radius: 6px;
            color: var(--text-white);
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--dark-red);
            color: var(--text-white);
            border: 1px solid var(--primary-red);
            border-radius: 6px;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background-color: var(--primary-red);
            box-shadow: 0 0 15px var(--primary-red);
        }

        #statusBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: var(--input-black);
            border: 1px solid var(--primary-red);
            border-radius: 6px;
            text-align: center;
            color: var(--primary-red);
            font-size: 13px;
            font-weight: bold;
        }

        #resultsArea {
            display: none;
            margin-top: 30px;
        }

        .results-header {
            color: var(--primary-red);
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-red);
            padding-bottom: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .category-card {
            background-color: var(--input-black);
            border: 1px solid var(--border-red);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-info h4 {
            color: var(--text-white);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .category-info p {
            color: var(--text-dim-red);
            font-size: 11px;
        }

        .tag-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            background: rgba(255, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">⚡ FLACO <span>X</span></div>
        <div class="status-badge">ENGINE v8.5 READY</div>
    </div>

    <form id="scanForm" onsubmit="iniciarAnalisis(event)">
        <div class="form-group">
            <label>🔑 Clave VIP de Acceso</label>
            <input type="text" id="keyInput" value="FLACOX-VIP-S9RRY8" required>
        </div>

        <div class="form-group">
            <label>📱 Número de Serie / Serial (Opcional)</label>
            <input type="text" id="serialInput" placeholder="Ej. F2LXX001K300">
        </div>

        <div class="form-group">
            <label>📦 Paquete de Diagnóstico Sysdiagnose (.tar.gz / .zip)</label>
            <input type="file" id="fileInput" accept=".gz,.tar.gz,.zip" required>
        </div>

        <button type="submit" class="btn-submit">Iniciar Análisis Forense Profundo</button>
    </form>

    <div id="statusBox">Conectando con el servidor...</div>

    <div id="resultsArea">
        <div class="results-header">📋 RESULTADOS DEL ANÁLISIS FORENSE</div>
        <div id="categoriesList"></div>
    </div>
</div>

<script>
// La URL de tu backend en Render
const BACKEND_URL = "https://flacox-backend.onrender.com";

async function iniciarAnalisis(e) {
    e.preventDefault();

    const key = document.getElementById("keyInput").value.trim();
    const serial = document.getElementById("serialInput").value.trim();
    const file = document.getElementById("fileInput").files[0];

    const statusBox = document.getElementById("statusBox");
    const resultsArea = document.getElementById("resultsArea");
    const categoriesList = document.getElementById("categoriesList");

    resultsArea.style.display = "none";
    statusBox.style.display = "block";
    statusBox.innerText = "⏳ Verificando clave e iniciando escaneo forense...";

    const formData = new FormData();
    formData.append("key", key);
    formData.append("serial", serial);
    formData.append("file", file);

    try {
        const response = await fetch(`${BACKEND_URL}/scan`, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Error en el análisis");
        }

        statusBox.style.display = "none";
        resultsArea.style.display = "block";
        categoriesList.innerHTML = "";

        data.results.forEach(cat => {
            const card = document.createElement("div");
            card.className = "category-card";
            card.innerHTML = `
                <div class="category-info">
                    <h4>${cat.name}</h4>
                    <p>${cat.desc}</p>
                </div>
                <div class="tag-status">${cat.status}</div>
            `;
            categoriesList.appendChild(card);
        });

    } catch (error) {
        statusBox.innerText = `❌ ERROR: ${error.message}`;
    }
}
</script>

</body>
</html>
